<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Plan Payment Tracker</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8e8e8;background:#101114}
*{box-sizing:border-box}body{margin:0}.app{max-width:850px;margin:auto;padding:20px}
h1,h2,p{margin:0}.sub{color:#999;margin-top:4px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}
.card{background:#181a1f;border:1px solid #30333a;border-radius:14px;padding:16px;margin-bottom:14px}
input,button{font:inherit;border-radius:9px;border:1px solid #3a3d45;background:#111318;color:#eee;padding:9px 11px}
button{cursor:pointer}.primary{background:#e8e8e8;color:#111;border-color:#e8e8e8}.danger{color:#ff9b9b}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#aaa}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:13px;border:1px solid #30333a;border-radius:12px}.stat small{color:#999}.stat strong{display:block;font-size:22px;margin-top:3px}
.member{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #292c32}.member:last-child{border-bottom:0}.status{font-size:13px}.paid{color:#8ee6a4}.pending{color:#ffcf70}
.add{display:flex;gap:8px;margin-top:12px}.add input{flex:1;min-width:0}
.history{max-height:350px;overflow:auto}.histrow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #292c32;font-size:14px}.muted{color:#999}.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.member{grid-template-columns:1fr auto}.member .remove{grid-column:2}.histrow{grid-template-columns:1fr auto}.histrow .date{grid-column:1}.app{padding:13px}}
</style>
</head>
<body>
<main class="app">
<section class="card">
<div class="top">
<div><h1>Family Plan</h1><p class="sub">Monthly payment tracker</p></div>
<div class="controls">
<label>Month<input id="month" type="month"></label>
<label>Amount/person<input id="amount" type="number" min="0" step="1" value="30"></label>
</div>
</div>
</section>

<section class="stats">
<div class="stat"><small>Members</small><strong id="membersCount">0</strong></div>
<div class="stat"><small>Collected</small><strong id="collected">₹0</strong></div>
<div class="stat"><small>Pending</small><strong id="pending">₹0</strong></div>
</section>

<section class="card">
<div class="top"><h2>Members</h2><span class="muted" id="paidCount"></span></div>
<div id="members"></div>
<form class="add" id="addForm"><input id="name" maxlength="40" placeholder="Friend's name" required><button class="primary">Add</button></form>
</section>

<section class="card">
<div class="top"><h2>Payment history</h2><div class="actions"><button id="export">Export backup</button><label><button type="button" id="importBtn">Import backup</button><input id="file" type="file" accept=".json" hidden></label></div></div>
<div class="history" id="history"></div>
</section>

<section class="card">
<h2>Data</h2><p class="sub" style="margin-top:7px">Data is stored only in this browser on this device. Export a backup regularly.</p>
<div class="actions" style="margin-top:12px"><button id="resetMonth">Reset current month</button><button id="clear" class="danger">Delete all data</button></div>
</section>
</main>

<script>
(() => {
const KEY='family-plan-payment-tracker-v1';
const $=id=>document.getElementById(id);
const now=new Date(), current=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const defaults=[1,2,3,4,5].map((id,i)=>({id,name:`Friend ${i+1}`}));
let data={amount:30,members:defaults,payments:{}};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.members)&&saved.payments)data={...data,...saved}}catch{}
$('month').value=current;$('amount').value=data.amount;

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return '₹'+Math.max(0,n).toLocaleString('en-IN')}
function monthLabel(m){const [y,mo]=m.split('-');return new Date(Number(y),Number(mo)-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'})}
function render(){
 const month=$('month').value||current; data.amount=Math.max(0,Number($('amount').value)||0);
 const paid=data.members.filter(m=>data.payments[`${month}|${m.id}`]);
 $('membersCount').textContent=data.members.length;
 $('collected').textContent=money(paid.length*data.amount);
 $('pending').textContent=money((data.members.length-paid.length)*data.amount);
 $('paidCount').textContent=`${paid.length}/${data.members.length} paid`;
 $('members').innerHTML='';
 data.members.forEach(m=>{
   const isPaid=!!data.payments[`${month}|${m.id}`];
   const row=document.createElement('div');row.className='member';
   row.innerHTML=`<div><strong></strong><div class="status ${isPaid?'paid':'pending'}">${isPaid?'Paid':'Pending'} · ${money(data.amount)}</div></div><button class="toggle">${isPaid?'Mark pending':'Mark paid'}</button><button class="remove danger">Remove</button>`;
   row.querySelector('strong').textContent=m.name;
   row.querySelector('.toggle').onclick=()=>{const k=`${month}|${m.id}`;if(isPaid)delete data.payments[k];else data.payments[k]={amount:data.amount,date:new Date().toISOString()};save();render()};
   row.querySelector('.remove').onclick=()=>{if(confirm(`Remove ${m.name}? Their historical payments will also be removed.`)){delete data.members[data.members.indexOf(m)];data.members=data.members.filter(Boolean);Object.keys(data.payments).filter(k=>k.endsWith('|'+m.id)).forEach(k=>delete data.payments[k]);save();render()}};
   $('members').appendChild(row);
 });
 renderHistory();
}
function renderHistory(){
 const entries=[];
 for(const [key,v] of Object.entries(data.payments)){
   const [month,id]=key.split('|'),m=data.members.find(x=>String(x.id)===String(id));
   if(m)entries.push({month,name:m.name,amount:v.amount,date:v.date});
 }
 entries.sort((a,b)=>b.date.localeCompare(a.date));
 $('history').innerHTML=entries.length?entries.map(e=>`<div class="histrow"><span>${monthLabel(e.month)}</span><span>${e.name}</span><span>${money(e.amount)} · ${new Date(e.date).toLocaleDateString('en-IN')}</span></div>`).join(''):'<p class="muted">No payments recorded yet.</p>';
}
$('addForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;data.members.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),name});$('name').value='';save();render()};
$('month').onchange=render;
$('amount').oninput=()=>{data.amount=Math.max(0,Number($('amount').value)||0);save();render()};
$('resetMonth').onclick=()=>{const month=$('month').value;Object.keys(data.payments).filter(k=>k.startsWith(month+'|')).forEach(k=>delete data.payments[k]);save();render()};
$('clear').onclick=()=>{if(confirm('Delete ALL members and payment history?')){localStorage.removeItem(KEY);location.reload()}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`family-plan-backup-${current}.json`;a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const imported=JSON.parse(await f.text());if(!Array.isArray(imported.members)||!imported.payments)throw Error();data=imported;save();render();alert('Backup imported successfully.')}catch{alert('Invalid backup file.')}e.target.value=''};
save();render();
})();
</script>
</body>
</html>
